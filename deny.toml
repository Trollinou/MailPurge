# cargo-deny configuration
[graph]
targets = []
all-features = false
no-default-features = false

[output]
feature-depth = 1

# 1. Advisories (Vulnerability audits)
[advisories]
ignore = [
    { id = "RUSTSEC-2024-0370", reason = "Transitive dependency via gtk/tauri" },
    { id = "RUSTSEC-2026-0441", reason = "Transitive dependency via async-imap 0.10, archived macro crate with zero vulnerability" },
    { id = "RUSTSEC-2026-0459", reason = "Transitive dependency via rusqlite 0.32 bundled libsqlite3-sys, safe local app db usage" },
]

# 2. Licenses (Permissive allowed, any license not in `allow` is denied)
[licenses]
confidence-threshold = 0.8
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "0BSD",
    "ISC",
    "Unicode-3.0",
    "Zlib",
    "CC0-1.0",
    "Unlicense",
    "MPL-2.0",
    "CDLA-Permissive-2.0",
]

[[licenses.clarify]]
name = "ring"
expression = "MIT AND ISC"
license-files = [
    { path = "LICENSE", hash = 0xbd0eed23 }
]

# 3. Bans (Duplicate crates, banned dependencies)
[bans]
multiple-versions = "warn"
wildcards = "allow"
highlight = "all"
deny = []

# 4. Sources (Registry integrity)
[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
