[package]
name = "mailpurge-core"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"

[dependencies]
psl = "2.1"
mail-parser = "0.9"
async-trait = "0.1"
futures = "0.3"
tokio = { version = "1.40", features = ["net", "rt-multi-thread", "macros", "time"] }
async-imap = { version = "0.10", default-features = false, features = ["runtime-tokio"] }
tokio-rustls = "0.26"
rustls-native-certs = "0.8"
webpki-roots = "0.26"
rustls-pki-types = "1.0"
deunicode = "1.6"
chrono = { version = "0.4", features = ["serde"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
rusqlite = { version = "0.32", features = ["bundled"] }
imap-proto = "0.16"
ureq = "2.10"
open = "5.3"
keyring = { version = "3.6", features = ["apple-native", "windows-native", "linux-native-sync-persistent"] }
sha2 = "0.10"
base64 = "0.22"

[lints]
workspace = true

[dev-dependencies]
rstest = "0.24"
mockall = "0.13"
proptest = "1.6"
pretty_assertions = "1.4"

[package.metadata.cargo-machete]
ignored = ["chrono", "imap-proto"]

