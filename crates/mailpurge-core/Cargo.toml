[package]
name = "mailpurge-core"
version = "0.1.0"
edition = "2021"

[dependencies]
psl = "2.1"
mailparse = "0.15"
deunicode = "1.6"
chrono = { version = "0.4", features = ["serde"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
rusqlite = { version = "0.32", features = ["bundled"] }
imap = { version = "3.0.0-alpha.15", default-features = false, features = ["rustls-tls"] }
imap-proto = "0.16"

[dev-dependencies]
