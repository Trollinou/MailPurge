[package]
name = "mailpurge-app"
version = "0.1.0"
description = "Nettoyeur intelligent de boîtes mails (M365, Gmail, IMAP)"
authors = ["Etienne"]
edition = "2021"
license = "MIT OR Apache-2.0"

[lib]
name = "mailpurge_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.1", features = [] }

[dependencies]
tauri = { version = "2.1", features = [] }
tauri-plugin-shell = "2.1"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1", features = ["full"] }
dirs = "5.0"
chrono = { version = "0.4", features = ["serde"] }
mailpurge-core = { path = "../crates/mailpurge-core" }

[package.metadata.cargo-machete]
ignored = ["serde_json", "tokio", "tauri-build"]

